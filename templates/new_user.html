<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add User</title>
  <!-- <link rel="stylesheet" href="new_user.css"> -->
  <link rel="stylesheet" href="https://unpkg.com/papercss@1.8.0/dist/paper.min.css">
  <style>
  body {
    display: grid;
    place-items: center;
    overflow-x: hidden;
    min-height: 100vh;
    background-color: #f6eee3;
    opacity: 1;
    background-size: 20px 20px;
    background-image:  repeating-linear-gradient(0deg, #e5decf, #e5decf 1px, #f6eee3 1px, #f6eee3);
  }
  
  .card {
    background-color: #f5f5f5;
    width: 320px;
    max-width: 90vw;
  }

  /* Mobile responsive styles - only apply on small screens */
  @media (max-width: 768px) {
    body {
      padding: 15px;
    }

    .card {
      width: 100%;
      max-width: 90vw;
    }

    .card-body {
      padding: 1.25rem;
    }

    .input-block {
      font-size: 16px; /* Prevents auto-zoom on iOS */
      padding: 12px;
    }

    .btn-block {
      padding: 12px;
      font-size: 16px;
    }
  }

  @media (max-width: 480px) {
    body {
      padding: 10px;
      background-size: 15px 15px;
    }

    .card {
      max-width: 95vw;
    }

    .card-body {
      padding: 1rem;
    }

    .card-header {
      font-size: 1.25rem;
      padding: 0.875rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .input-block {
      padding: 10px;
    }

    .btn-block {
      padding: 10px;
    }
  }
  </style>
</head>
<body>
  <!-- <h1>Add New User</h1> -->
  <!-- <form method="POST">
    Name: <input type="text" name="name"><br>
    Email: <input type="email" name="email"><br>
    Role: <input type="text" name="role"><br>
    <input type="submit" value="Add">
  </form> -->



<form class="card shadow shadow-large shadow-hover" method="POST">
    <div class="card-header">Add New User</div>
    <div class="card-body">
      <div class="form-group">
        <input class="input-block" type="text" placeholder="Name" name="name" id="paperInputs1" minlength="2" required>
      </div>
      <div class="form-group">
        <input class="input-block" type="email" placeholder="Email" name="email" id="paperInputs1" required>
      </div>  
      <div class="form-group">
        <input class="input-block" type="role" placeholder="Role" name="role" id="paperInputs1" required>
      </div>     
      <button class="btn-block background-secondary" type="submit" value="Add">Submit</button>
    </div>
  </form>

</body>
</html>
