<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Detail</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/papercss@1.8.0/dist/paper.min.css">
  <style>
    body {
      overflow-x: hidden;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Neucha', sans-serif;
    }
    .card {
      width: 90%;
      max-width: 500px;
      margin: 2rem auto;
      box-sizing: border-box;
      padding: 1rem;
    }
    ul {
      padding-left: 1rem;
    }
    li.card-text {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      word-break: break-word;
    }
    button {
      margin-left: 2.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .card {
        width: 95%;
        margin: 1rem auto;
        padding: 0.75rem;
      }
      li.card-text {
        font-size: 1rem;
        margin-bottom: 0.6rem;
      }
      button {
        margin-left: 1rem;
        padding: 0.5rem;
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>
<body>
  <h1 style="text-align: center; margin-top: 1rem;">User Detail</h1>
  <div class="card">
    <div class="card-body">
      <ul>
        <li class="card-text">Name: {{ user[1] }}</li>
        <li class="card-text">Email: {{ user[2] }}</li>
        <li class="card-text">Role: {{ user[3] }}</li>
      </ul>
      <a href="{{ url_for('users') }}">
        <button>Back to list</button>
      </a>
    </div>
  </div>
</body>
</html>
